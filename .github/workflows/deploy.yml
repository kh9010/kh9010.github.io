name: Publish the preview branch of kahransingh.com

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch the preview branch of the site
        run: |
          git clone --depth 1 --branch preview https://github.com/kh9010/kahransingh.com site
          echo "preview is at $(git -C site rev-parse --short HEAD)"
          rm -rf site/.git site/CNAME
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
